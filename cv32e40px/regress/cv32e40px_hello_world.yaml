# YAML file to specify the ci_check regression testlist.
name: cv32e40px_ci_check
description: Commit sanity for the cv32e40px

builds:
  corev-dv:
    cmd: make comp_corev-dv
    dir: cv32e40px/sim/uvmt
    
  uvmt_cv32e40px:
    cmd: make comp
    dir: cv32e40px/sim/uvmt

tests:
  hello-world:
    build: uvmt_cv32e40px
    description: UVM Hello World Test
    dir: cv32e40px/sim/uvmt    
    cmd: make test COREV=YES TEST=hello-world
    num: 500
  